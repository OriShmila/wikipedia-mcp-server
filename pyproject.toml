[project]
name = "wikipedia-mcp-server"
version = "0.1.0"
description = "Wikipedia MCP server for accessing and searching Wikipedia content"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.6.0",
    "wikipedia-api>=0.6.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
wikipedia-mcp-server = "wikipedia_mcp_server.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikipedia_mcp_server"]
force-include = { "wikipedia_mcp_server/tools.json" = "wikipedia_mcp_server/tools.json" }

[tool.hatch.build.targets.sdist]
include = [
  "wikipedia_mcp_server/**",
  "README.md",
  "LICENSE",
]
